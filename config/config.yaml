data_path: "data/raw/rna_seq_cancer.csv"
labels_path: "data/raw/labels.csv"
pca:
  n_components: 50
split:
  test_size: 0.2
seed: 42
model: ["randomforest", "svm", "logistic_regression", "xgboost"]
tuning:
  enabled: false
  param_grids:
    randomforest:
      n_estimators: [100, 200, 300]
      max_depth: [3, 5, 10, null]
    logistic_regression:
      C: [0.01, 0.1, 1, 10]
      l1_ratio: [0, 1]
      solver: ["saga"]
      max_iter: [1000]
    svm:
      C: [0.01, 0.1, 1, 10]
      max_iter: [1000]
      kernel: ["linear", "rbf"]
    xgboost:
      n_estimators: [50, 100]
      max_depth: [3, 5]
      learning_rate: [0.01, 0.1]
      subsample: [0.8]
  default_grids:
    randomforest:
      n_estimators: 200
    logistic_regression:
      max_iter: 1000
    svm:
      kernel: "rbf"
    xgboost:
      n_estimators: 200
run_nested_cv: true

